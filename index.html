<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <?!= include('Styles'); ?>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  </head>
  <body>
    <div class="app-container">
      <header class="glass">
        <div class="identity-header">
           <img src="<?= madrasahLogo ?>" alt="Logo" class="madrasah-logo">
           <div class="madrasah-info">
             <h2><?= madrasahName ?></h2>
             <p>Sistem Presensi Digital</p>
           </div>
        </div>
        
        <div class="nav-tabs">
          <button class="tab-btn active" data-tab="presensi">Presensi</button>
          <button class="tab-btn" data-tab="scan">Scan QR</button>
          <button class="tab-btn" data-tab="dashboard">Dashboard</button>
          <button class="tab-btn" data-tab="laporan">Laporan</button>
        </div>
      </header>

      <main class="glass card-main">
        <div id="loading" class="loading-box hidden">
          <div class="spinner"></div>
          <p style="font-weight: 600; color: var(--text-muted)">Menghubungkan ke server...</p>
        </div>

        <!-- Section: Scan QR -->
        <section id="scan-section" class="hidden">
          <div class="scan-container">
            <div class="form-group" style="margin-bottom: 15px;">
              <label class="group-label">Jenis Absensi (Scan)</label>
              <div class="jenis-container scan-mode">
                <input type="radio" id="scanJenisMasuk" name="scanJenis" value="Masuk" checked>
                <label for="scanJenisMasuk" class="jenis-label" style="width: 100%;">Masuk</label>
              </div>
            </div>
            
            <div id="reader-wrapper">
              <div id="reader"></div>
              <div class="scan-overlay">
                <div class="scan-line"></div>
              </div>
            </div>
            
            <div id="scan-feedback" class="feedback-card hidden">
              <div class="feedback-icon success">
                <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" fill="none"></path></svg>
              </div>
              <div class="feedback-info">
                <h4 id="scan-student-name">...</h4>
                <p id="scan-status-msg">Berhasil Absen</p>
              </div>
            </div>

            <div id="scan-restart-wrapper" class="hidden" style="text-align: center; margin-top: 20px;">
              <button onclick="startScanner();" class="tab-btn active" style="width: 100%;">Buka Scanner Kembali</button>
            </div>

            <p style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 15px;">
              Arahkan kamera ke QR Code (NISN) siswa.
            </p>
          </div>
        </section>

        <!-- Section: Presensi -->
        <section id="presensi-section">
          <form id="attendanceForm">
            <div class="form-group">
              <label class="group-label">Jenis Kehadiran</label>
              <div class="jenis-container">
                <input type="radio" id="jenisMasuk" name="jenis" value="Masuk" checked>
                <label for="jenisMasuk" class="jenis-label" style="width: 100%;">Absen Masuk saja</label>
              </div>
            </div>

            <div class="form-group">
              <label class="group-label">Tanggal Absensi</label>
              <input type="date" id="attendanceDate" class="select-custom">
            </div>

            <div class="form-group">
              <label class="group-label">Pilih Kelas</label>
              <select id="classSelect" class="select-custom" required onchange="filterStudentsByClass()">
                <option value="" disabled selected>Pilih Kelas</option>
              </select>
            </div>

            <div class="form-group">
              <label class="group-label">Daftar Siswa</label>
              <div class="student-list-box">
                <div class="list-header" id="listHeader">
                  <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="selectAll" onclick="toggleAllStudents(this)" style="zoom: 1.2">
                    <span style="font-size: 0.8rem; font-weight: 700;">Pilih Semua</span>
                  </div>
                  <div class="bulk-status" id="bulkStatus">
                    <span style="font-size: 0.7rem; color: var(--text-muted)">Bulk Status:</span>
                    <select onchange="applyBulkStatus(this.value)">
                      <option value="Hadir">Hadir</option>
                      <option value="Izin">Izin</option>
                      <option value="Sakit">Sakit</option>
                      <option value="Alpha">Alpha</option>
                    </select>
                  </div>
                </div>
                <div id="studentRows" class="student-rows">
                  <p style="padding: 40px; text-align: center; color: var(--text-muted); font-size: 0.85rem">Pilih kelas terlebih dahulu</p>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="group-label">Keterangan Tambahan (Opsional)</label>
              <textarea id="keterangan" placeholder="Alasan lain jika diperlukan..."></textarea>
            </div>

            <button type="submit" id="submitBtn">
              <span>Kirim Presensi Sekarang</span>
            </button>
          </form>

          <div id="successCard" class="hidden" style="text-align: center; padding: 20px 0;">
            <div style="width: 80px; height: 80px; background: #dcfce7; color: #15803d; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
              <svg style="width: 40px; height: 40px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
            <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 8px;">Berhasil!</h2>
            <p id="successMessage" style="color: var(--text-muted); margin-bottom: 32px;"></p>
            <button onclick="resetForm()" class="btn-refresh" style="background: #f1f5f9; padding: 12px 24px; border-radius: 12px; font-weight: 700;">Kembali</button>
          </div>
        </section>

        <!-- Section: Dashboard -->
        <section id="dashboard-section" class="hidden">
           <div id="dashboardList"></div>
           <div id="emptyDashboard" class="hidden" style="text-align: center; padding: 40px 0;">
             <p style="color: var(--text-muted)">Belum ada riwayat hari ini.</p>
           </div>
        </section>

        <!-- Section: Laporan -->
        <section id="laporan-section" class="hidden">
          <div class="form-group">
            <label class="group-label">Jenis Laporan</label>
            <select id="reportType" class="select-custom" onchange="toggleReportForms()">
              <option value="daily">Laporan Harian (PDF)</option>
              <option value="monthly">Rekap Bulanan (PDF)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="group-label">Pilih Kelas</label>
            <select id="reportClassSelect" class="select-custom">
              <option value="" disabled selected>Pilih Kelas</option>
            </select>
          </div>

          <div id="dailyForm" class="form-group">
            <label class="group-label">Pilih Tanggal</label>
            <input type="date" id="reportDate" class="select-custom">
          </div>

          <div id="monthlyForm" class="form-group hidden" style="display: flex; gap: 10px;">
            <div style="flex: 1;">
              <label class="group-label">Bulan</label>
              <select id="reportMonth" class="select-custom">
                <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
                <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
                <option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option>
                <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
              </select>
            </div>
            <div style="flex: 1;">
              <label class="group-label">Tahun</label>
              <select id="reportYear" class="select-custom">
                <option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option>
              </select>
            </div>
          </div>

          <button onclick="fetchReport()" class="tab-btn active" style="width: 100%; margin-top: 20px;">Lihat Laporan</button>
          
          <div id="reportResult" class="hidden" style="margin-top: 32px;">
            <div id="reportTableContainer" class="summary-item" style="display: block; overflow-x: auto; padding: 0; border: none;">
               <!-- Table injected here -->
            </div>
            <button onclick="printReport()" id="printBtn" class="tab-btn" style="width: 100%; margin-top: 16px; background: var(--accent); color: white;">Cetak / PDF</button>
          </div>
        </section>
      </main>

      <footer><p>&copy; 2024 <?= madrasahName ?> • App v2.1</p></footer>
    </div>

    <?!= include('Scripts'); ?>
  </body>
</html>
